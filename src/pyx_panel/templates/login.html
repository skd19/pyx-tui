<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - pyx-panel</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.5.2 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom Light Theme CSS -->
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center p-3" style="min-height: 100vh;">
    <div class="card shadow-sm border-0 p-4 p-sm-5" style="max-width: 440px; width: 100%; border-radius: 1rem;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-3 p-3 mb-3 text-white shadow-sm"
                 style="background: linear-gradient(135deg, #2563eb, #4f46e5); width: 3.5rem; height: 3.5rem; font-size: 1.5rem;">
                <i class="fa-solid fa-server"></i>
            </div>
            <h2 class="fw-bold text-dark mb-1">pyx-panel</h2>
            <p class="text-muted text-sm mb-0">VPS Nginx & Systemd Service Manager</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 text-xs d-flex align-items-center mb-4" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="d-flex flex-column gap-3">
            <div>
                <label for="token" class="form-label text-xs fw-semibold text-uppercase text-muted">
                    Secret Access Token
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="token" name="token" required autofocus
                           placeholder="Paste token from terminal"
                           class="form-control border-start-0 ps-0">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 mt-2 fw-semibold">
                <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Authenticate & Access Panel
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center text-xs text-muted">
            Check the terminal where you ran <code class="bg-light px-1 py-0.5 rounded text-dark">pyx-panel</code> for the access token and auto-login link.
        </div>
    </div>
</body>
</html>
